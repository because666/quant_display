[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "python311Packages.virtualenv"
]

[phases.build]
cmds = [
    "cd backend && pip install -r requirements.txt"
]

[phases.setup.nixPkgs]
# 添加必要的系统库
nixPkgs = ["python311", "python311Packages.pip", "glibc", "libgcc"]

[start]
cmd = "cd backend && python -m uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"
