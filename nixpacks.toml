[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "gcc",
    "glibc"
]

[phases.build]
cmds = [
    "python -m pip install --upgrade pip",
    "cd backend && pip install -r requirements.txt"
]

[start]
cmd = "cd backend && python -m uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"
